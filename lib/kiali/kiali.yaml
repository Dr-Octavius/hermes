apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: mesh-monitoring
spec:
  version: "v1.89.0"
  istio_namespace: "istio-system"

  deployment:
    accessible_namespaces:
      - '**'
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 1Gi
    node_selector:
      nodepool: "monitoring-np"
    pod_labels:
      sidecar.istio.io/inject: "false"

  auth:
    strategy: anonymous

  external_services:
    prometheus:
      url: "http://prometheus.mesh-monitoring:9090/"
    grafana:
      enabled: true
      in_cluster_url: "http://grafana.mesh-monitoring:3000/"
    tracing:
      enabled: true
      in_cluster_url: "http://tracing.mesh-monitoring:16685/jaeger"

  kiali_feature_flags:
    certificates_information_indicators:
      enabled: true
      secrets:
        - cacerts
        - istio-ca-secret

  server:
    port: 20001
    observability:
      metrics:
        enabled: true
        port: 9090